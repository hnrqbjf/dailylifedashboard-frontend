<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DLD - Daily Life Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2461D9">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #EEF2F8;
    --surface:   #FFFFFF;
    --border:    #D4DCE9;
    --text:      #111827;
    --muted:     #5C6B82;
    --accent:    #2461D9;
    --accent-bg: #EBF0FD;
    --tomado:    #0E9E6A;
    --tomado-bg: #E8F8F2;
    --pendente:  #D97706;
    --pendente-bg: #FEF3E2;
    --nao:       #D93636;
    --nao-bg:    #FDEAEA;
    --anulado:    #6B7280;
    --anulado-bg: #EEF1F5;
    --shadow:    0 1px 3px rgba(20,40,80,.08), 0 1px 8px rgba(20,40,80,.05);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #0D1219;
      --surface:   #151E2A;
      --border:    #232F3E;
      --text:      #E8EFF8;
      --muted:     #7A8FA6;
      --accent:    #4D86F5;
      --accent-bg: #162040;
      --tomado:    #22C78A;
      --tomado-bg: #0A2418;
      --pendente:  #F59E0B;
      --pendente-bg: #2A1C06;
      --nao:       #F56565;
      --nao-bg:    #2A0A0A;
      --anulado:    #9AA7B8;
      --anulado-bg: #1B2634;
      --shadow:    0 1px 3px rgba(0,0,0,.3);
    }
  }

  :root[data-theme="dark"] {
    --bg:        #0D1219;
    --surface:   #151E2A;
    --border:    #232F3E;
    --text:      #E8EFF8;
    --muted:     #7A8FA6;
    --accent:    #4D86F5;
    --accent-bg: #162040;
    --tomado:    #22C78A;
    --tomado-bg: #0A2418;
    --pendente:  #F59E0B;
    --pendente-bg: #2A1C06;
    --nao:       #F56565;
    --nao-bg:    #2A0A0A;
    --anulado:    #9AA7B8;
    --anulado-bg: #1B2634;
    --shadow:    0 1px 3px rgba(0,0,0,.3);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 88px;
  }

  .shell {
    max-width: 440px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ── Header ── */
  .header { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; }
  .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.3px; }
  .header .date { font-size: .875rem; color: var(--muted); font-weight: 500; }

  /* ── Card expansível (Medicamentos e Hábitos) ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 16px;
    cursor: pointer;
    user-select: none;
  }
  .card-header:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .card-header-title {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }
  .card-header-title .icone { font-size: 1.1rem; }
  .card-header-title .nome { font-size: 1.05rem; font-weight: 700; }
  .card-header-sub {
    font-size: .8rem;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chevron {
    flex-shrink: 0;
    color: var(--muted);
    font-size: .8rem;
    transition: transform .2s;
  }
  .card.open .chevron { transform: rotate(180deg); }

  .card-body { display: none; padding: 0 16px 16px; }
  .card.open .card-body { display: block; }

  /* ── Cards de medicamento / linhas de hábito ── */
  .med-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: box-shadow .15s;
  }

  .med-info { flex: 1; min-width: 0; }
  .med-nome {
    font-size: 1rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .med-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }
  .med-hora {
    font-size: .8rem;
    color: var(--muted);
    font-weight: 500;
  }
  .badge-atrasado {
    font-size: .7rem;
    font-weight: 600;
    color: var(--pendente);
    background: var(--pendente-bg);
    padding: 1px 7px;
    border-radius: 99px;
    letter-spacing: .3px;
    text-transform: uppercase;
  }

  /* ── Botão de status (Medicamentos) ── */
  .btn-status {
    flex-shrink: 0;
    border: none;
    cursor: pointer;
    border-radius: 10px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: .2px;
    transition: opacity .12s, transform .1s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .btn-status:active { transform: scale(.96); }
  .btn-status:disabled { opacity: .45; cursor: default; }

  .btn-status.tomado   { background: var(--tomado-bg);   color: var(--tomado);   }
  .btn-status.pendente { background: var(--pendente-bg); color: var(--pendente); }
  .btn-status.nao      { background: var(--nao-bg);      color: var(--nao);      cursor: default; }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 40px 0;
    color: var(--muted);
    font-size: .9rem;
  }
  .empty .icon { font-size: 2rem; display: block; margin-bottom: 8px; }

  /* ── Seção ── */
  .section-label {
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  /* ── Cabeçalho de lista: navegação de dia / label + botão adicionar ── */
  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 8px;
  }

  .date-nav { display: flex; align-items: center; gap: 2px; }

  .nav-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 1.1rem;
    line-height: 1;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .12s, color .12s;
  }
  .nav-btn:hover:not(:disabled) { background: var(--accent-bg); color: var(--accent); }
  .nav-btn:disabled { opacity: .3; cursor: default; }

  .date-label-btn {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
  }
  .date-label-btn:hover { color: var(--text); }

  .btn-hoje {
    border: none;
    background: var(--accent-bg);
    color: var(--accent);
    font-family: inherit;
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .3px;
    padding: 4px 10px;
    border-radius: 99px;
    cursor: pointer;
    margin-left: 4px;
  }

  .btn-icon-add {
    flex-shrink: 0;
    border: none;
    background: var(--accent);
    color: #fff;
    width: 32px;
    height: 32px;
    border-radius: 10px;
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .12s, transform .1s;
  }
  .btn-icon-add:hover { opacity: .9; }
  .btn-icon-add:active { transform: scale(.94); }

  #data-picker-input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  /* ── Status somente leitura (dias passados de Medicamentos) ── */
  .status-readonly {
    flex-shrink: 0;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: .2px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .status-readonly.tomado   { background: var(--tomado-bg);   color: var(--tomado);   }
  .status-readonly.pendente { background: var(--pendente-bg); color: var(--pendente); }
  .status-readonly.nao      { background: var(--nao-bg);      color: var(--nao);      }

  /* ── Destaque de streak, centralizado, no topo do card ── */
  .streak-destaque {
    text-align: center;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 16px;
  }
  .streak-destaque strong {
    font-size: 1.3rem;
    color: var(--accent);
  }

  /* ── Hábitos: linha por hábito ── */
  .habito-grupo { margin-bottom: 14px; }
  .habito-grupo:last-child { margin-bottom: 0; }

  .habito-row {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 10px 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .habito-row:last-child { margin-bottom: 0; }

  .habito-nome {
    flex: 1;
    min-width: 0;
    font-size: .92rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Chip de status atual (só leitura — a ação fica dentro de "Opções") ── */
  .habito-status-chip {
    flex-shrink: 0;
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .2px;
    padding: 4px 10px;
    border-radius: 99px;
    color: var(--muted);
    background: var(--border);
  }
  .habito-status-chip.cor-feito     { background: var(--tomado-bg);   color: var(--tomado);   }
  .habito-status-chip.cor-nao-feito { background: var(--nao-bg);      color: var(--nao);      }
  .habito-status-chip.cor-anulado   { background: var(--anulado-bg); color: var(--anulado); }

  /* ── Botão único "Opções" — abre a folha com marcação/editar/excluir ── */
  .btn-opcoes {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .12s, color .12s;
  }
  .btn-opcoes:hover { background: var(--accent-bg); color: var(--accent); }

  /* ── Folha de opções (marcar status / editar / excluir) ── */
  .opcoes-lista { display: flex; flex-direction: column; gap: 8px; }

  .opcao-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: .92rem;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: opacity .12s, transform .1s;
  }
  .opcao-btn:active { transform: scale(.98); }
  .opcao-btn .opcao-icone { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }

  .opcao-btn.ativo.cor-feito     { background: var(--tomado-bg);   color: var(--tomado);   border-color: transparent; }
  .opcao-btn.ativo.cor-nao-feito { background: var(--nao-bg);      color: var(--nao);      border-color: transparent; }
  .opcao-btn.ativo.cor-anulado   { background: var(--anulado-bg); color: var(--anulado); border-color: transparent; }
  .opcao-btn.perigo { color: var(--nao); }

  .opcao-divider { height: 1px; background: var(--border); margin: 6px 2px; }

  /* ── Calendário de Hábitos ── */
  .btn-toggle-calendario {
    margin-top: 14px;
    border: none;
    background: transparent;
    color: var(--accent);
    font-family: inherit;
    font-size: .8rem;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 0;
  }

  .calendario-wrap { display: none; margin-top: 6px; }
  .calendario-wrap.open { display: block; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .cal-dia {
    aspect-ratio: 1;
    border-radius: 5px;
    background: var(--anulado-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .62rem;
    font-weight: 700;
    color: #fff;
  }
  .cal-dia.cal-concluido { background: var(--tomado); }
  .cal-dia.cal-quebrado  { background: var(--nao); }
  .cal-dia.cal-neutro    { background: var(--anulado); }
  .cal-dia.cal-aberto    { background: transparent; border: 1px dashed var(--border); color: var(--muted); }

  .cal-legenda {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 10px;
    font-size: .75rem;
    color: var(--muted);
  }
  .cal-legenda span { display: flex; align-items: center; gap: 5px; }
  .cal-dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .cal-dot.cal-concluido { background: var(--tomado); }
  .cal-dot.cal-quebrado  { background: var(--nao); }
  .cal-dot.cal-neutro    { background: var(--anulado); }

  /* ── Formulário ── */
  .form-row { display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: .8rem; font-weight: 600; color: var(--muted); letter-spacing: .3px; }
  .field input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: .95rem;
    color: var(--text);
    transition: border-color .15s;
    outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .field-aviso { font-size: .75rem; color: var(--muted); margin-top: -4px; }

  .btn-add {
    margin-top: 4px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-family: inherit;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn-add:hover { opacity: .9; }
  .btn-add:active { transform: scale(.98); }
  .btn-add:disabled { opacity: .5; cursor: default; }

  /* ── Modal (bottom sheet) ── */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10,16,28,.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s;
    z-index: 90;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }

  .modal-sheet {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    padding: 20px;
    box-shadow: 0 -4px 24px rgba(0,0,0,.18);
    transform: translateY(100%);
    transition: transform .22s ease-out;
  }
  .modal-backdrop.open .modal-sheet { transform: translateY(0); }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .modal-header h2 { font-size: 1rem; font-weight: 600; }

  .btn-close {
    border: none;
    background: var(--bg);
    color: var(--muted);
    width: 30px;
    height: 30px;
    border-radius: 8px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-close:hover { color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    .modal-backdrop, .modal-sheet { transition: none; }
  }

  /* ── Botão global: minimizar todos os cards ── */
  .btn-minimizar-tudo {
    position: fixed;
    right: 16px;
    bottom: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 9px 16px;
    font-family: inherit;
    font-size: .8rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
    z-index: 40;
    transition: color .12s, border-color .12s;
  }
  .btn-minimizar-tudo:hover { color: var(--accent); border-color: var(--accent); }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text);
    color: var(--surface);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: .875rem;
    font-weight: 500;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── Spinner ── */
  .loading { display: flex; justify-content: center; padding: 32px 0; }
  .spinner {
    width: 24px; height: 24px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
    .btn-status, .btn-add, #toast { transition: none; }
  }
</style>
</head>
<body>
<div class="shell">

  <header class="header">
    <h1>DLD - Daily Life Dashboard</h1>
    <p class="date" id="hoje-label"></p>
  </header>

  <!-- ═══════════════ Card: Medicamentos ═══════════════ -->
  <div class="card" id="card-medicamentos">
    <div class="card-header" role="button" tabindex="0" aria-expanded="false"
         onclick="toggleCard('medicamentos')"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleCard('medicamentos');}">
      <div class="card-header-title">
        <span class="icone">💊</span>
        <span class="nome">Medicamentos</span>
      </div>
      <span class="chevron">▾</span>
    </div>

    <div class="card-body" id="medicamentos-body">
      <div class="list-header">
        <div class="date-nav">
          <button class="nav-btn" id="nav-prev" aria-label="Dia anterior" onclick="navigateDay(-1)">‹</button>
          <button class="date-label-btn" id="date-label-btn" onclick="abrirSeletorData()">Hoje</button>
          <button class="nav-btn" id="nav-next" aria-label="Próximo dia" onclick="navigateDay(1)" disabled>›</button>
          <button class="btn-hoje" id="btn-hoje" onclick="irParaHoje()" style="display:none">Hoje</button>
        </div>
        <button class="btn-icon-add" aria-label="Adicionar medicamento" onclick="abrirModalMedicamento()">+</button>
      </div>
      <input type="date" id="data-picker-input" onchange="onDataEscolhida(this.value)">
      <div id="med-list"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  </div>

  <!-- ═══════════════ Card: Hábitos ═══════════════ -->
  <div class="card" id="card-habitos">
    <div class="card-header" role="button" tabindex="0" aria-expanded="false"
         onclick="toggleCard('habitos')"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleCard('habitos');}">
      <div class="card-header-title">
        <span class="icone">🧩</span>
        <span class="nome">Hábitos</span>
      </div>
      <span class="card-header-sub" id="habitos-header-badges"></span>
      <span class="chevron">▾</span>
    </div>

    <div class="card-body" id="habitos-body">
      <div class="streak-destaque" id="streak-destaque"></div>

      <div class="list-header">
        <span class="section-label" style="margin-bottom:0">Seus hábitos</span>
        <button class="btn-icon-add" aria-label="Adicionar hábito" onclick="abrirModalHabito()">+</button>
      </div>
      <div id="habitos-list"><div class="loading"><div class="spinner"></div></div></div>

      <button class="btn-toggle-calendario" id="btn-toggle-calendario" onclick="toggleCalendario()">Ver calendário ▾</button>
      <div class="calendario-wrap" id="habitos-calendario">
        <div class="cal-grid" id="calendario-grid"></div>
        <div class="cal-legenda">

          <span><i class="cal-dot cal-neutro"></i> Neutro</span>
        </div>

</div>

<!-- Botão global — minimiza todos os cards abertos, sem descartar o que já foi carregado -->
<button class="btn-minimizar-tudo" id="btn-minimizar-tudo" onclick="minimizarTudo()">▾ Minimizar tudo</button>

<div id="toast"></div>

<!-- Modal: Adicionar medicamento -->
<div class="modal-backdrop" id="modal-backdrop-med" onclick="fecharModalSeFundo(event, 'modal-backdrop-med', fecharModalMedicamento)">

<div class="modal-backdrop" id="modal-backdrop-habito" onclick="fecharModalSeFundo(event, 'modal-backdrop-habito', fecharModalHabito)">
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-titulo-habito">
    <div class="modal-header">

    <div class="modal-header">
      <h2 id="modal-titulo-opcoes">Opções</h2>
      <button class="btn-close" aria-label="Fechar" onclick="fecharOpcoesHabito()">×</button>
    </div>
    <div class="opcoes-lista" id="opcoes-lista"></div>
  </div>
</div>

<script>
// Troque pela URL real do Cloud Run assim que o deploy existir
// (ex: 'https://dld-app-xxxxxxx-uw.a.run.app').
const API = 'https://dld-app-352695518853.us-west1.run.app';

/* ── Chave de API: pedida uma vez, guardada só neste navegador ──
   Nunca fica escrita em nenhum arquivo do repositório — só existe
   dentro do localStorage do aparelho de quem está usando o app. */
const API_KEY_STORAGE = 'dld_api_key';

function getApiKey() {
  let chave = localStorage.getItem(API_KEY_STORAGE);
  while (!chave) {
    chave = prompt('Cole sua chave de acesso ao app:');
    if (chave) {
      chave = chave.trim();
      localStorage.setItem(API_KEY_STORAGE, chave);
    }
  }
  return chave;
}

function authHeaders(extra = {}) {
  return { 'Authorization': `Bearer ${getApiKey()}`, ...extra };
}

/* Se o servidor disser que a chave está errada (401), esquece a chave salva
   e pede de novo na próxima ação — evita ficar preso com uma chave inválida
   sem saber por quê. */
function tratarNaoAutorizado(res) {
  if (res.status === 401) {
    localStorage.removeItem(API_KEY_STORAGE);
    toast('Chave de acesso inválida. Recarregue a página para tentar de novo.');
    return true;
  }
  return false;
}

/* ── Data real de hoje (fixa, não muda com a navegação) ── */
const hojeReal = new Date();
document.getElementById('hoje-label').textContent = hojeReal.toLocaleDateString('pt-BR', {
  weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
});

function dataISOHoje() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* ── Utilitários compartilhados ── */
function toast(msg, dur = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fecharModalSeFundo(e, backdropId, fecharFn) {
  if (e.target.id === backdropId) fecharFn();
}

/* ══════════════════════════════════════════════════════════════════
   Cards expansíveis — lazy init: fechado não chama API nenhuma; a
   primeira expansão de cada card dispara o carregamento daquele
   módulo. Reabrir depois de minimizado NUNCA dispara um novo fetch —
   só alterna visibilidade (classe "open").
   ══════════════════════════════════════════════════════════════════ */
const cardState = {
  medicamentos: { iniciado: false, open: false },
  habitos:      { iniciado: false, open: false },
};

function toggleCard(nomeModulo) {
  const state = cardState[nomeModulo];
  const card = document.getElementById(`card-${nomeModulo}`);
  const header = card.querySelector('.card-header');

  state.open = !state.open;
  card.classList.toggle('open', state.open);
  header.setAttribute('aria-expanded', String(state.open));

  if (state.open && !state.iniciado) {
    state.iniciado = true;
    if (nomeModulo === 'medicamentos') initMedicamentos();
    if (nomeModulo === 'habitos') initHabitos();
  }
}

function minimizarTudo() {
  Object.keys(cardState).forEach(nomeModulo => {
    if (cardState[nomeModulo].open) {
      cardState[nomeModulo].open = false;
      const card = document.getElementById(`card-${nomeModulo}`);
      card.classList.remove('open');
      card.querySelector('.card-header').setAttribute('aria-expanded', 'false');
    }
  });
}

/* ══════════════════════════════════════════════════════════════════
   MEDICAMENTOS
   ══════════════════════════════════════════════════════════════════ */

/* ── Estado da data sendo visualizada (navegação Hoje / dias anteriores) ── */
let dataVisualizada = dataISOHoje();

function ehHoje(iso) {
  return iso === dataISOHoje();
}

function somarDias(iso, delta) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + delta);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

function atualizarCabecalhoNav() {
  const label = document.getElementById('date-label-btn');
  const btnHoje = document.getElementById('btn-hoje');
  const navNext = document.getElementById('nav-next');

  if (ehHoje(dataVisualizada)) {
    label.textContent = 'Hoje';
    btnHoje.style.display = 'none';
  } else {
    const [y, m, d] = dataVisualizada.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    label.textContent = dt.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' });
    btnHoje.style.display = '';
  }

  navNext.disabled = ehHoje(dataVisualizada);
  document.getElementById('data-picker-input').value = dataVisualizada;
}

function navigateDay(delta) {
  const alvo = somarDias(dataVisualizada, delta);
  if (alvo > dataISOHoje()) return; // nunca navega pro futuro
  dataVisualizada = alvo;
  atualizarCabecalhoNav();
  loadMeds();
}

function irParaHoje() {
  dataVisualizada = dataISOHoje();
  atualizarCabecalhoNav();
  loadMeds();
}

function abrirSeletorData() {
  const input = document.getElementById('data-picker-input');
  try {
    input.showPicker();
  } catch {
    input.focus();
    input.click();
  }
}

function onDataEscolhida(valor) {
  if (!valor) return;
  if (valor > dataISOHoje()) {
    toast('Não é possível ver datas futuras.');
    atualizarCabecalhoNav();
    return;
  }
  dataVisualizada = valor;
  atualizarCabecalhoNav();
  loadMeds();
}

/* ── Modal de adicionar medicamento ── */
function abrirModalMedicamento() {
  document.getElementById('modal-backdrop-med').classList.add('open');
  setTimeout(() => document.getElementById('med-nome').focus(), 200);
}

function fecharModalMedicamento() {
  document.getElementById('modal-backdrop-med').classList.remove('open');
}

function isAtrasado(horario, statusDia) {
  if (!ehHoje(dataVisualizada)) return false; // "atrasado" só faz sentido olhando hoje
  if (statusDia !== 'PENDENTE') return false;
  const [h, m] = horario.split(':').map(Number);
  const agora = new Date();
  return agora.getHours() > h || (agora.getHours() === h && agora.getMinutes() > m);
}

function statusIcon(status) {
  if (status === 'TOMADO')    return '✓';
  if (status === 'NAO_TOMADO') return '✗';
  return '○';
}

function statusLabel(status) {
  if (status === 'TOMADO')    return 'Tomado';
  if (status === 'NAO_TOMADO') return 'Não tomado';
  return 'Marcar';
}

/* ── Renderização ── */
function renderList(meds) {
  const el = document.getElementById('med-list');
  const hojeSendoVisto = ehHoje(dataVisualizada);

  if (!meds.length) {
    el.innerHTML = `<div class="empty">
      <span class="icon">💊</span>
      ${hojeSendoVisto ? 'Nenhum medicamento cadastrado ainda.' : 'Nenhum medicamento estava ativo nesse dia.'}
    </div>`;
    return;
  }

  // NOVA LÓGICA DE ORDENAÇÃO
  meds.sort((a, b) => {
    // 1. Define pesos para os status (PENDENTE vem primeiro, TOMADO depois)
    const pesoStatus = { 'PENDENTE': 1, 'TOMADO': 2 };

    // Se houver algum outro status (como NAO_TOMADO), ele recebe peso 3 (vai pro final)
    const pesoA = pesoStatus[a.status_dia] || 3;
    const pesoB = pesoStatus[b.status_dia] || 3;

    // Se os status forem diferentes, ordena pelos pesos
    if (pesoA !== pesoB) {
      return pesoA - pesoB;
    }

    // 2. Se os status forem iguais, ordena pelo horário (do menor para o maior)
    return a.horario.localeCompare(b.horario);
  });

  el.innerHTML = meds.map(med => {
    const atrasado = isAtrasado(med.horario, med.status_dia);
    const cls = med.status_dia === 'TOMADO' ? 'tomado'
              : med.status_dia === 'NAO_TOMADO' ? 'nao'
              : 'pendente';
    const horaFmt = med.horario.substring(0, 5);

    const acaoHtml = hojeSendoVisto
      ? `<button
          class="btn-status ${cls}"
          data-id="${med.id}"
          data-status="${med.status_dia}"
          ${med.status_dia === 'NAO_TOMADO' ? 'disabled' : ''}
          onclick="toggleStatus(this)"
        >
          <span>${statusIcon(med.status_dia)}</span>
          <span>${statusLabel(med.status_dia)}</span>
        </button>`
      : `<span class="status-readonly ${cls}">
          <span>${statusIcon(med.status_dia)}</span>
          <span>${statusLabel(med.status_dia) === 'Marcar' ? 'Pendente' : statusLabel(med.status_dia)}</span>
        </span>`;

    return `<div class="med-card" style="margin-bottom:10px">
      <div class="med-info">
        <div class="med-nome">${escHtml(med.nome)}</div>
        <div class="med-meta">
          <span class="med-hora">${horaFmt}</span>
          ${atrasado ? '<span class="badge-atrasado">Atrasado</span>' : ''}
        </div>
      </div>
      ${acaoHtml}
    </div>`;
  }).join('');
}

/* ── Carregar lista (do dia sendo visualizado) ── */
async function loadMeds() {
  const listEl = document.getElementById('med-list');
  listEl.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const url = ehHoje(dataVisualizada)
      ? `${API}/medicamentos`
      : `${API}/medicamentos?data=${dataVisualizada}`;
    const res = await fetch(url, { headers: authHeaders() });
    if (tratarNaoAutorizado(res)) return;
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    renderList(await res.json());
  } catch (e) {
    listEl.innerHTML =
      `<div class="empty"><span class="icon">⚠️</span>Não foi possível conectar ao servidor.<br><small>Verifique sua conexão e tente recarregar a página.</small></div>`;
  }
}

/* ── Toggle TOMADO / PENDENTE (sempre no dia de hoje) ── */
async function toggleStatus(btn) {
  const id = btn.dataset.id;
  const current = btn.dataset.status;
  const next = current === 'TOMADO' ? 'PENDENTE' : 'TOMADO';

  btn.disabled = true;
  try {
    const res = await fetch(`${API}/medicamentos/${id}/registro-diario`, {
      method: 'PATCH',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ status: next }),
    });
    if (tratarNaoAutorizado(res)) return;
    if (!res.ok) throw new Error();
    toast(next === 'TOMADO' ? 'Marcado como tomado ✓' : 'Desmarcado');
    await loadMeds();
  } catch {
    toast('Erro ao atualizar status');
    btn.disabled = false;
  }
}

/* ── Adicionar medicamento ── */
document.getElementById('add-form-med').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  const nome = document.getElementById('med-nome').value.trim();
  const horario = document.getElementById('med-horario').value;

  btn.disabled = true;
  btn.textContent = 'Adicionando…';

  try {
    const res = await fetch(`${API}/medicamentos`, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ nome, horario }),
    });
    if (tratarNaoAutorizado(res)) return;
    if (!res.ok) throw new Error();
    e.target.reset();
    toast(`${nome} adicionado ✓`);
    fecharModalMedicamento();
    if (!ehHoje(dataVisualizada)) irParaHoje(); else await loadMeds();
  } catch {
    toast('Erro ao adicionar medicamento');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Adicionar';
  }
});

/* ── Init (só roda na primeira expansão do card) ── */
function initMedicamentos() {
  atualizarCabecalhoNav();
  loadMeds();
}

/* ══════════════════════════════════════════════════════════════════
   HÁBITOS
   ══════════════════════════════════════════════════════════════════ */

let habitosCache = [];
let streakAtual = 0;
let habitoEditandoId = null;
let calendarioIniciado = false;

/* ── Init (só roda na primeira expansão do card) ── */
async function initHabitos() {
  await Promise.all([carregarStreak(), carregarHabitosLista()]);
}

async function carregarStreak() {
  try {
    const res = await fetch(`${API}/habitos/streak`, { headers: authHeaders() });
    if (tratarNaoAutorizado(res)) return;
    if (!res.ok) throw new Error();
    const data = await res.json();
    streakAtual = data.streak_atual;
    atualizarHeaderHabitos();
  } catch {
    // silencioso — o header simplesmente não mostra a streak; a lista de
    // hábitos ainda tenta carregar normalmente.
  }
}

async function carregarHabitosLista() {
  const listEl = document.getElementById('habitos-list');
  listEl.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const res = await fetch(`${API}/habitos`, { headers: authHeaders() });
    if (tratarNaoAutorizado(res)) return;
    if (!res.ok) throw new Error();
    habitosCache = await res.json();
    renderHabitos();
    atualizarHeaderHabitos();
  } catch {
    listEl.innerHTML =
      `<div class="empty"><span class="icon">⚠️</span>Não foi possível conectar ao servidor.<br><small>Verifique sua conexão e tente recarregar a página.</small></div>`;
  }
}

/* ── Indicador do cabeçalho: streak + "X de Y" (RN-17, calculado aqui,
   nunca pelo backend) ── */
function atualizarHeaderHabitos() {
  const badge = document.getElementById('habitos-header-badges');
  const total = habitosCache.length;
  if (total === 0) {
    badge.textContent = streakAtual ? `🔥 ${streakAtual}` : '';
  } else {
    const feitos = habitosCache.filter(h => h.status_hoje === 'FEITO').length;
    const anulados = habitosCache.filter(h => h.status_hoje === 'ANULADO').length;
    const y = total - anulados;
    badge.textContent = `🔥 ${streakAtual} · ${feitos}/${y} hoje`;
  }
  atualizarStreakDestaque();
}

/* ── Destaque centralizado da streak, no topo do card ── */
function atualizarStreakDestaque() {
  const el = document.getElementById('streak-destaque');
  const triste = streakAtual === 0 ? ' 😢' : '';
  el.innerHTML = `Seu streak atual é: <strong>${streakAtual}</strong>!${triste}`;
}

/* ── Renderização, agrupada por categoria (client-side, RN-22) ── */
function renderHabitos() {
  const el = document.getElementById('habitos-list');

  if (!habitosCache.length) {
    el.innerHTML = `<div class="empty"><span class="icon">🧩</span>Nenhum hábito cadastrado ainda.</div>`;
    return;
  }

  const grupos = {};
  habitosCache.forEach(h => {
    const cat = (h.categoria || '').trim() || 'Sem categoria';
    if (!grupos[cat]) grupos[cat] = [];
    grupos[cat].push(h);
  });

  const categorias = Object.keys(grupos).sort((a, b) => {
    if (a === 'Sem categoria') return 1;
    if (b === 'Sem categoria') return -1;
    return a.localeCompare(b, 'pt-BR');
  });

  el.innerHTML = categorias.map(cat => `
    <div class="habito-grupo">
      <div class="section-label">${escHtml(cat)}</div>
      ${grupos[cat].map(habitoRowHtml).join('')}
    </div>
  `).join('');
}

function corClasseStatus(status) {
  if (status === 'FEITO') return 'cor-feito';
  if (status === 'NAO_FEITO') return 'cor-nao-feito';
  if (status === 'ANULADO') return 'cor-anulado';
  return '';
}

function labelStatusHabito(status) {
  if (status === 'FEITO') return 'Feito';
  if (status === 'NAO_FEITO') return 'Não feito';
  if (status === 'ANULADO') return 'Anulado';
  return 'Pendente';
}

function habitoRowHtml(h) {
  const s = h.status_hoje;
  return `<div class="habito-row">
    <div class="habito-nome">${escHtml(h.nome)}</div>
    <span class="habito-status-chip ${corClasseStatus(s)}">${labelStatusHabito(s)}</span>
    <button class="btn-opcoes" onclick="abrirOpcoesHabito('${h.id}')" aria-label="Opções de ${escHtml(h.nome)}">⋯</button>
  </div>`;
}

/* ── Marcar / trocar / reverter status do dia (RN-06: sem máquina de
   estados — clicar no status já ativo reverte pra PENDENTE; clicar em
   outro troca direto, sem validação de transição) ── */
async function marcarHabito(id, statusAlvo) {
  const habito = habitosCache.find(h => h.id === id);
  if (!habito) return;

  const novoStatus = habito.status_hoje === statusAlvo ? 'PENDENTE' : statusAlvo;

  try {
    const res = await fetch(`${API}/habitos/${id}/registro-diario`, {
      method: 'PATCH',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ status: novoStatus }),
    });
    if (tratarNaoAutorizado(res)) return;
    if (!res.ok) throw new Error();
    const atualizado = await res.json();
    const idx = habitosCache.findIndex(h => h.id === id);
    if (idx >= 0) habitosCache[idx] = atualizado;
    renderHabitos();
    atualizarHeaderHabitos();
  } catch {
    toast('Erro ao atualizar hábito');
  }
}

/* ── Folha de opções: marcar status / editar / excluir, tudo atrás de um
   único botão "⋯" por hábito ── */
function abrirOpcoesHabito(id) {
  const h = habitosCache.find(x => x.id === id);
  if (!h) return;

  document.getElementById('modal-titulo-opcoes').textContent = h.nome;

  const opcaoStatus = (status, icone, titulo) => {
    const ativo = h.status_hoje === status;
    return `<button
        class="opcao-btn ${ativo ? 'ativo ' + corClasseStatus(status) : ''}"
        onclick="fecharOpcoesHabito(); marcarHabito('${h.id}','${status}');"
      ><span class="opcao-icone">${icone}</span>${titulo}${ativo ? ' (reverter p/ pendente)' : ''}</button>`;
  };

  document.getElementById('opcoes-lista').innerHTML = `
    ${opcaoStatus('FEITO', '✓', 'Feito')}
    ${opcaoStatus('NAO_FEITO', '✗', 'Não feito')}
    ${opcaoStatus('ANULADO', '⊘', 'Anular')}
    <div class="opcao-divider"></div>
    <button class="opcao-btn" onclick="fecharOpcoesHabito(); abrirModalHabito('${h.id}');"><span class="opcao-icone">✎</span>Editar</button>
    <button class="opcao-btn perigo" onclick="fecharOpcoesHabito(); excluirHabito('${h.id}');"><span class="opcao-icone">🗑</span>Excluir</button>
  `;

  document.getElementById('modal-backdrop-opcoes').classList.add('open');
}

function fecharOpcoesHabito() {
  document.getElementById('modal-backdrop-opcoes').classList.remove('open');
}

/* ── Modal de criar/editar hábito (F7) ── */
function abrirModalHabito(id = null) {
  habitoEditandoId = id;
  const titulo = document.getElementById('modal-titulo-habito');
  const btn = document.getElementById('habito-form-submit');
  const aviso = document.getElementById('habito-edit-aviso');
  const form = document.getElementById('habito-form');

  if (id) {
    const h = habitosCache.find(x => x.id === id);
    titulo.textContent = 'Editar hábito';
    document.getElementById('habito-nome').value = h ? h.nome : '';
    document.getElementById('habito-categoria').value = (h && h.categoria) || '';
    btn.textContent = 'Salvar';
    aviso.style.display = '';
  } else {
    titulo.textContent = 'Novo hábito';
    form.reset();
    btn.textContent = 'Adicionar';
    aviso.style.display = 'none';
  }

  document.getElementById('modal-backdrop-habito').classList.add('open');
  setTimeout(() => document.getElementById('habito-nome').focus(), 200);
}

function fecharModalHabito() {
  document.getElementById('modal-backdrop-habito').classList.remove('open');
  habitoEditandoId = null;
}

document.getElementById('habito-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('habito-form-submit');
  const nome = document.getElementById('habito-nome').value.trim();
  const categoria = document.getElementById('habito-categoria').value.trim() || null;

  btn.disabled = true;

  try {
    const editando = habitoEditandoId;
    const res = editando
      ? await fetch(`${API}/habitos/${editando}`, {
          method: 'PATCH',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ nome, categoria }),
        })
      : await fetch(`${API}/habitos`, {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ nome, categoria }),
        });

    if (tratarNaoAutorizado(res)) return;
    if (!res.ok) throw new Error();
    const habito = await res.json();

    if (editando) {
      const idx = habitosCache.findIndex(h => h.id === editando);
      if (idx >= 0) habitosCache[idx] = habito;
    } else {
      habitosCache.push(habito);
    }

    renderHabitos();
    atualizarHeaderHabitos();
    toast(editando ? 'Hábito atualizado ✓' : `${nome} adicionado ✓`);
    fecharModalHabito();
  } catch {
    toast('Erro ao salvar hábito');
  } finally {
    btn.disabled = false;
  }
});

/* ── Exclusão com confirmação (F8 — confirm() nativo, sem padrão prévio
   de modal de exclusão no app pra reaproveitar) ── */
async function excluirHabito(id) {
  const h = habitosCache.find(x => x.id === id);
  if (!h) return;
  if (!confirm(`Excluir "${h.nome}"? Essa ação não pode ser desfeita.`)) return;

  try {
    const res = await fetch(`${API}/habitos/${id}`, {
      method: 'DELETE',
      headers: authHeaders(),
    });
    if (tratarNaoAutorizado(res)) return;
    if (!res.ok && res.status !== 204) throw new Error();
    habitosCache = habitosCache.filter(x => x.id !== id);
    renderHabitos();
    atualizarHeaderHabitos();
    toast('Hábito excluído');
  } catch {
    toast('Erro ao excluir hábito');
  }
}

/* ── Calendário (F6) — segundo nível de lazy-load: só carrega quando o
   usuário abre essa sub-seção, mesmo com o card de Hábitos já aberto ── */
function toggleCalendario() {
  const wrap = document.getElementById('habitos-calendario');
  const btn = document.getElementById('btn-toggle-calendario');
  const aberto = wrap.classList.toggle('open');
  btn.textContent = aberto ? 'Ocultar calendário ▴' : 'Ver calendário ▾';

  if (aberto && !calendarioIniciado) {
    calendarioIniciado = true;
    carregarCalendario();
  }
}

function isoDeData(dt) {
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

async function carregarCalendario() {
  const grid = document.getElementById('calendario-grid');
  grid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

  const ate = dataISOHoje();
  const desdeDt = new Date();
  desdeDt.setDate(desdeDt.getDate() - 34); // últimos 35 dias, inclusive hoje
  const desde = isoDeData(desdeDt);

  try {
    const res = await fetch(`${API}/habitos/calendario?desde=${desde}&ate=${ate}`, { headers: authHeaders() });
    if (tratarNaoAutorizado(res)) return;
    if (!res.ok) throw new Error();
    const dias = await res.json();
    renderCalendario(desde, ate, dias);
  } catch {
    grid.innerHTML = '<div class="empty">Não foi possível carregar o calendário.</div>';
  }
}

function renderCalendario(desde, ate, dias) {
  const porData = {};
  dias.forEach(d => { porData[d.data] = d.classificacao; });

  const grid = document.getElementById('calendario-grid');
  const cursor = new Date(`${desde}T00:00:00`);
  const fim = new Date(`${ate}T00:00:00`);
  const celulas = [];

  while (cursor <= fim) {
    const iso = isoDeData(cursor);
    const classificacao = porData[iso];
    const cls = classificacao ? classificacao.toLowerCase() : 'aberto';
    const labelData = cursor.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    const labelStatus = classificacao ? ` — ${classificacao}` : ehHoje(iso) ? ' — hoje' : ' — ainda não fechado';
    const diaVisivel = String(cursor.getDate()).padStart(2, '0');
    celulas.push(`<div class="cal-dia cal-${cls}" title="${labelData}${labelStatus}">${diaVisivel}</div>`);
    cursor.setDate(cursor.getDate() + 1);
  }

  grid.innerHTML = celulas.join('');
}

/* ── PWA: registra o service worker (necessário pra virar instalável) ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {
      // Falha silenciosa: sem service worker, o app ainda funciona normalmente,
      // só não fica instalável/offline — não é crítico pro uso do dia a dia.
    });
  });
}
